[project]
name = "twincar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "torchvision",
  "timm",
  "albumentations>=2.0",
  "transformers",
  "wandb",
  "hydra-core",
  "pillow",
  "numpy",
  "scipy",
  "scikit-learn",
  "pyyaml",
  "gradio",
  "typer",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov", "mypy", "pre-commit"]
api = ["fastapi", "uvicorn[standard]", "python-multipart"]
explain = ["grad-cam", "captum"]
onnx = ["onnx", "onnxruntime"]
ocr = ["easyocr"]
detect = ["ultralytics>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer relies on calls (Option/Argument) as parameter defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
